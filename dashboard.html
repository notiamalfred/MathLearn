<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard · MathLearn</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Math<span>Learn</span></a>
      <button id="logout-btn" class="btn" style="margin-left:auto;">Log out</button>
    </div>
  </header>

  <main class="container" style="padding:64px 20px;">
    <h1 style="color:#44337a;">Choose your practice</h1>

    <section style="margin-top:32px;">
      <h2 style="color:#6b46c1;">Curriculum</h2>
      <div style="display:flex; gap:16px; margin-top:12px;">
        <button class="btn curriculum-btn" data-curriculum="core">Core</button>
        <button class="btn curriculum-btn" data-curriculum="m2">M2</button>
      </div>
    </section>

    <section id="topics-section" style="margin-top:32px; display:none;">
      <h2 style="color:#6b46c1;">Topics</h2>
      <div id="topics-list" style="display:flex; flex-wrap:wrap; gap:12px; margin-top:12px;"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="questions-data.js"></script>
  <script>
    (async () => {
      const user = await window.ML.requireUser();
      if (!user) return; // redirected to login.html

      document.getElementById("logout-btn").addEventListener("click", () => window.ML.signOut());

      let selectedCurriculum = null;

      document.querySelectorAll(".curriculum-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedCurriculum = btn.dataset.curriculum;
          document.querySelectorAll(".curriculum-btn").forEach(b => b.classList.remove("btn-active"));
          btn.classList.add("btn-active");

          const topics = QUESTIONS_DATA[selectedCurriculum] || {};
          const list = document.getElementById("topics-list");
          list.innerHTML = "";
          Object.keys(topics).forEach(topic => {
            const a = document.createElement("a");
            a.href = `practice.html?curriculum=${selectedCurriculum}&topic=${encodeURIComponent(topic)}`;
            a.className = "btn";
            a.textContent = topic;
            list.appendChild(a);
          });
          document.getElementById("topics-section").style.display = "block";
        });
      });
    })();
  </script>
</body>
</html>
